name: pr-title
on:
  pull_request_target:
    types: [opened, edited]
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: check title
        run: |
          echo "${{ github.event.pull_request.title }}" | grep -E '^(feat|fix|chore):'
